name: Build Executables (Windows & Linux)

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Linux Qt & build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libdbus-1-3 libxcb-cursor0 libgl1

      - name: Create virtual environment and install packages
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip setuptools wheel Cython numpy
          .venv/bin/python -m pip install -e "./OpticalNetworkingGymV2[gui,dev]" pyinstaller

      - name: Build Linux executable
        run: |
          chmod +x packaging/build_linux.sh
          ./packaging/build_linux.sh

      - name: Self-test compiled Linux executable
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ./dist/OpticalNetworkingGymV2/OpticalNetworkingGymV2 --self-test

      - name: Package Linux archive
        run: |
          cd dist
          tar -czf OpticalNetworkingGymV2-linux-x86_64.tar.gz OpticalNetworkingGymV2

      - name: Upload Linux build artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpticalNetworkingGymV2-linux-x86_64
          path: dist/OpticalNetworkingGymV2-linux-x86_64.tar.gz

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up MSVC compiler for Cython extensions
        uses: ilammy/msvc-dev-cmd@v1

      - name: Create virtual environment and install packages
        shell: cmd
        run: |
          python -m venv .venv
          .venv\Scripts\python.exe -m pip install --upgrade pip setuptools wheel Cython numpy
          .venv\Scripts\python.exe -m pip install -e ".\OpticalNetworkingGymV2[gui,dev]" pyinstaller

      - name: Build Windows executable
        shell: cmd
        run: |
          call packaging\build_windows.bat

      - name: Self-test compiled Windows executable
        env:
          QT_QPA_PLATFORM: offscreen
        shell: cmd
        run: |
          dist\OpticalNetworkingGymV2\OpticalNetworkingGymV2.exe --self-test

      - name: Package Windows ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path dist\OpticalNetworkingGymV2 -DestinationPath dist\OpticalNetworkingGymV2-windows-x86_64.zip

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpticalNetworkingGymV2-windows-x86_64
          path: dist/OpticalNetworkingGymV2-windows-x86_64.zip

  release:
    needs: [build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: OpticalNetworkingGymV2-linux-x86_64
          path: release-assets

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: OpticalNetworkingGymV2-windows-x86_64
          path: release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/OpticalNetworkingGymV2-linux-x86_64.tar.gz
            release-assets/OpticalNetworkingGymV2-windows-x86_64.zip
